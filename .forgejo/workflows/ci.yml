name: CI

on: [push]

jobs:
  check:
    runs-on: codebahn-small
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
